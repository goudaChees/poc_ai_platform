name: ai-poc-ocr

services:
  ocr-paddle:
    image: ${DOCKER_REGISTRY}/ocr-paddle:1.1.0-internal
    restart: unless-stopped
    environment:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "1"
      PADDLE_MODEL_ROOT: /opt/ocr/models
    networks:
      - ai-poc-network

  ocr-tesseract:
    image: ${DOCKER_REGISTRY}/ocr-tesseract:1.0.0
    restart: unless-stopped
    environment:
      OCR_LANG: "kor+eng"
      OCR_PSM: "6"
    networks:
      - ai-poc-network

networks:
  ai-poc-network:
    external: true
    name: ai-poc-network