x-airflow-common: &airflow-common
  image: ${DOCKER_REGISTRY}/ai-poc-airflow:3.0.6-python3.11
  user: "${AIRFLOW_UID}:${AIRFLOW_GID}"

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags

    # [Export|Import] Airflow 컨테이너 내부 통신 주소이므로 서비스명을 그대로 사용한다.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

    # Docker 밖에서 실행되는 Django Backend 주소.
    # 환경별 실제 주소는 platform .env에서 지정한다.
    BACKEND_API_BASE_URL: ${BACKEND_API_BASE_URL}

    # Airflow Metadata DB 연결.
    # postgres는 Compose 내부 서비스명이므로 환경이 바뀌어도 그대로 사용한다.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}

    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__FAB__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.session

    PYTHONPATH: /opt/airflow

    # Docker 내부 서비스 간 통신 주소는 서비스명을 사용한다.
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    OCR_MEDIA_ROOT: /opt/airflow/media

    OCR_PROVIDER: ${OCR_PROVIDER:-paddle}

    UPSTAGE_OCR_MODE: ${UPSTAGE_OCR_MODE:-REPLAY}

    UPSTAGE_API_KEY: ${UPSTAGE_API_KEY:-}
    UPSTAGE_OCR_URL: ${UPSTAGE_OCR_URL:-https://api.upstage.ai/v1/document-digitization}
    UPSTAGE_OCR_TIMEOUT: ${UPSTAGE_OCR_TIMEOUT:-60}

    QDRANT_URL: http://qdrant:6333
    QDRANT_COLLECTION_NAME: document_chunks

     # OCR Task가 접근하는 Application DB.
    BOARD_DB_HOST: postgres
    BOARD_DB_PORT: "5432"
    BOARD_DB_NAME: ${POSTGRES_DB}
    BOARD_DB_USER: ${POSTGRES_USER}
    BOARD_DB_PASSWORD: ${POSTGRES_PASSWORD}

    PADDLE_OCR_URL: http://ocr-paddle:8000
    PADDLE_OCR_TIMEOUT: "120"

    EMBEDDING_MODEL_CACHE_DIR: /opt/airflow/embedding-models

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./tasks:/opt/airflow/tasks
    - ./embedding-models:/opt/airflow/embedding-models
    # Host의 Django media 디렉터리를 Airflow 컨테이너에 공유한다.
    # Host 경로는 환경마다 다르므로 .env에서 지정한다.
    - ${MEDIA_HOST_PATH}:/opt/airflow/media
    - ./embedding-models:/opt/airflow/embedding-models

  networks:
    - default
    - ai-poc-network

  depends_on:
    postgres:
      condition: service_healthy

  restart: unless-stopped


services:
  postgres:
    image: ${DOCKER_REGISTRY}/postgres:16.14
    ## [Export|Import] container name 정리
    # container_name: board-postgres 
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # 최초 초기화 시 Airflow Metadata DB 생성에 사용
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}

    ports:
      # Host에서 Django Backend 등이 PostgreSQL에 접근하는 포트.
      - "${POSTGRES_PORT}:5432"

    volumes:
      # postgres_data는 Compose 내부 논리 이름
      # 실제 Docker Volume 이름은 compose 파일 하단부 volumes의 POSTGRES_VOLUME_NAME으로 결정
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  kafka:
    image: ${DOCKER_REGISTRY}/apache-kafka:4.0.0
    ## [Export|Import] container name 정리
    # container_name: kafka

    # KRaft Controller 설정에서 kafka라는 Hostname을 사용하므로 유지한다.
    hostname: kafka

    ports:
      ##  [Export|Import] 수정
      # - "9092:9092"
      # Docker 밖의 Backend Consumer가 접속하는 Kafka 포트
      - "${KAFKA_EXTERNAL_PORT}:9092"


    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Docker 내부 통신, 외부 통신, Controller 통신용 Listener
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      ##  [Export|Import] 수정
      # Docker 내부 서비스는 kafka:29092를 사용한다.
      # Docker 외부 Backend는 환경별 Host와 Port를 사용한다. (.env에서 지정)
      # KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-127.0.0.1}:${KAFKA_EXTERNAL_PORT:-9092}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    restart: unless-stopped


  kafka-ui:
    image: ${DOCKER_REGISTRY}/kafka-ui:v0.7.2
    ##  [Export|Import] container name 정리
    # container_name: kafka-ui

    ports:
      # Kafka UI Host 공개 포트.
      - "${KAFKA_UI_PORT}:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

    depends_on:
      - kafka

    restart: unless-stopped

  kafka-init:
    image: ${DOCKER_REGISTRY}/apache-kafka:4.0.0
    restart: "no"

    depends_on:
      - kafka

    environment:
      KAFKA_DOCUMENT_UPLOADED_TOPIC: ${KAFKA_DOCUMENT_UPLOADED_TOPIC}

    command:
      - /bin/bash
      - -c
      - |
        set -e

        echo "Waiting for Kafka..."

        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --list >/dev/null 2>&1
        do
          sleep 2
        done

        echo "Creating Kafka topic if necessary..."

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic "$${KAFKA_DOCUMENT_UPLOADED_TOPIC}" \
          --partitions 1 \
          --replication-factor 1

        echo "Kafka topic initialization complete."


  qdrant:
    image: ${DOCKER_REGISTRY}/qdrant:v1.18.1
    ##  [Export|Import] container name 정리
    # container_name: qdrant

    ports:
      # Qdrant Host 공개 포트.
      - "${QDRANT_PORT}:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    ##  [Export|Import] container name 정리
    # container_name: ai-poc-airflow-init
    restart: "no"

    # entrypoint: /bin/bash/

    command:
      - bash
      - -c
      - |
        set -e

        airflow db migrate

        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" \
        || true

    environment:
      <<: *airflow-common-env
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}


  airflow-api-server:
    <<: *airflow-common
    ##  [Export|Import] container name 정리
    # container_name: ai-poc-airflow-api-server

    command: api-server

    ports:
      - "${AIRFLOW_API_PORT}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully


  airflow-scheduler:
    <<: *airflow-common
    ##  [Export|Import] container name 정리
    # container_name: ai-poc-airflow-scheduler

    command: scheduler

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully


  airflow-dag-processor:
    <<: *airflow-common
    ##  [Export|Import] container name 정리
    # container_name: ai-poc-airflow-dag-processor

    command: dag-processor

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully


volumes:
  qdrant_data:
  
  ##  [Export|Import] 수정
  # PostgreSQL 데이터 볼륨
  # 현재 환경에서는 기존 볼륨 이름을 환경변수로 지정하고,
  # 신규 환경에서는 지정한 이름으로 Docker가 자동 생성한다.
  # 새환경에서 참조할 DB가 없다면 external true 값은 삭제해도 됨
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME_NAME:?POSTGRES_VOLUME_NAME을 설정해야 합니다}

networks:
  ai-poc-network:
    external: true
    name: ai-poc-network
  